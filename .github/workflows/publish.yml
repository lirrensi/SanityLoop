name: Publish packages

on:
  push:
    tags:
      - "core-v*"
      - "extras-v*"
  workflow_dispatch:

# npm trusted publishing uses GitHub's short-lived OIDC identity.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish (core / extras — per tag)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Resolve the release
        id: release
        shell: bash
        run: |
          # TWO INDEPENDENT TRAINS — the tag names the package AND the version:
          #   core-vX.Y.Z   -> publish @sanityloop/core only, at its own version
          #   extras-vX.Y.Z -> publish @sanityloop/extras only, at its own version
          # Each tag is validated against THAT package's version file. Extras
          # declares a core RANGE (packages/extras/shelf.json), never a lockstep
          # copy — bump core only when core changed.
          REF="${GITHUB_REF_NAME}"
          case "$REF" in
            core-v*)
              PKG=core
              ONLY=core
              VERSION="$(node -p "JSON.parse(require('fs').readFileSync('packages/core/package.json','utf8')).version")"
              TAG_VERSION="${REF#core-v}"
              ;;
            extras-v*)
              PKG=extras
              ONLY=extras
              VERSION="$(node -p "JSON.parse(require('fs').readFileSync('packages/extras/shelf.json','utf8')).version")"
              TAG_VERSION="${REF#extras-v}"
              ;;
            *)
              echo "::error::tag must be core-vX.Y.Z or extras-vX.Y.Z, got: $REF"
              exit 1
              ;;
          esac
          if [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::tag $REF does not match $PKG version $VERSION. Bump packages/$PKG, commit, then re-tag."
              exit 1
            fi
            echo "Publishing @sanityloop/$PKG @ $VERSION (from tag $REF)"
          else
            echo "Manual dispatch — publishing core @ $(node -p "JSON.parse(require('fs').readFileSync('packages/core/package.json','utf8')).version") + extras @ $(node -p "JSON.parse(require('fs').readFileSync('packages/extras/shelf.json','utf8')).version")"
            ONLY="core,extras"
          fi
          {
            echo "pkg=$PKG"
            echo "version=$VERSION"
            echo "only=$ONLY"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the publish artifacts
        run: node --experimental-strip-types --experimental-transform-types scripts/publish.ts --dry-run --only "${{ steps.release.outputs.only }}"

      - name: Publish
        run: node --experimental-strip-types --experimental-transform-types scripts/publish.ts --only "${{ steps.release.outputs.only }}"
        env:
          # Bootstrap with an npm granular automation token that has publish
          # access and bypass-2FA enabled. Store it as repository secret NPM_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}