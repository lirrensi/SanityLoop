name: Publish packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# npm trusted publishing uses GitHub's short-lived OIDC identity.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish core + extras
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Resolve the release version
        id: release
        shell: bash
        run: |
          # ONE source of truth: packages/core/package.json — extras ships at the
          # same version (lockstep). The `vX.Y.Z` tag is the TRIGGER and the
          # confirmation, not a second version. Bump core, commit, tag, push.
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('packages/core/package.json','utf8')).version")"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match core version $VERSION. Bump packages/core/package.json, commit, then re-tag."
              exit 1
            fi
            echo "Publishing from tag $GITHUB_REF_NAME (core + extras @ $VERSION)"
          else
            echo "Manual dispatch — publishing core + extras @ $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify the publish artifacts
        run: node --experimental-strip-types --experimental-transform-types scripts/publish.ts --dry-run

      - name: Publish core and extras
        run: node --experimental-strip-types --experimental-transform-types scripts/publish.ts
        env:
          # Bootstrap with an npm granular automation token that has publish
          # access and bypass-2FA enabled. Store it as repository secret NPM_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}