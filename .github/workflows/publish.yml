name: Publish packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# npm trusted publishing uses GitHub's short-lived OIDC identity.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish core + extras
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Detect explicit release version change
        id: release
        shell: bash
        run: |
          old_version="$(git show HEAD^:packages/core/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          new_version="$(node -p "JSON.parse(require('fs').readFileSync('packages/core/package.json', 'utf8')).version")"
          echo "old_version=$old_version"
          echo "new_version=$new_version"
          if [ "$old_version" != "$new_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Explicit release version change detected."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No explicit version change; skipping publish."
          fi

      - name: Verify the publish artifacts
        if: steps.release.outputs.changed == 'true'
        run: npm run publish:dry

      - name: Publish core and extras
        if: steps.release.outputs.changed == 'true'
        run: npm run publish
        env:
          # Bootstrap with an npm granular automation token that has publish
          # access and bypass-2FA enabled. Store it as repository secret NPM_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
