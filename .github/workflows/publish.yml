name: Publish packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# npm trusted publishing uses GitHub's short-lived OIDC identity.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish core + extras
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify the publish artifacts
        run: npm run publish:dry

      - name: Publish core and extras
        run: npm run publish
        env:
          # Bootstrap with an npm granular automation token that has publish
          # access and bypass-2FA enabled. Store it as repository secret NPM_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
