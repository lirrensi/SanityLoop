name: CI

# Gate, not a museum. Runs on every push/PR to main.
# `npm run verify` IS the gate: typecheck → unit → e2e → templates → live.
# tmux is installed so the REPL stream-delivery guard (repl-tmux) RUNS instead
# of silently skipping — a skipped guard is a dead guard.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    # Job-level so the live tier can see it.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tmux (the REPL guard needs a real terminal)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux

      - name: Install (clean, reproducible)
        run: npm ci

      - name: Verify (type → unit → e2e → templates → live)
        run: npm run verify
