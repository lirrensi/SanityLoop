name: CI

# Lean gate: docs + type + the hermetic unit-core slice (no PTY/tmux/sockets/
# kill-9 — the Git runner is not the place for chaos drills). The full board
# (`npm run verify`: unit → e2e → templates → live) runs locally and under
# `act -j gate-full`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, reproducible)
        run: npm ci

      - name: Verify (docs → type → unit-core)
        run: npm run verify -- --tier=docs,type,unit-core

  gate-full:
    # The whole board, for `act` and manual dispatch — never blocks a push.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tmux (the REPL guard needs a real terminal)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux

      - name: Install (clean, reproducible)
        run: npm ci

      - name: Verify (full board)
        run: npm run verify
